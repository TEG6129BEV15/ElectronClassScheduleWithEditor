<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>课表配置</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111c2f;
      --panel-strong: #162540;
      --border: #283a5d;
      --text: #eaf3ff;
      --muted: #a7b8d6;
      --accent: #72d6ff;
      --accent-2: #8ef2b1;
      --danger: #ff7d7d;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .dialog {
      width: min(100%, 560px);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(17, 28, 47, 0.97);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 28px var(--shadow);
      padding: 18px 18px 16px;
    }

    .title {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text);
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .button-list {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      overflow-y: auto;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(18, 32, 53, 0.9);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .option-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(114, 214, 255, 0.45);
      background: rgba(26, 44, 68, 0.9);
    }

    .option-btn.primary {
      background: linear-gradient(180deg, #1f3d7a, #17325e);
      border-color: rgba(114, 214, 255, 0.35);
    }

    .toolbar {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel-strong);
      color: var(--text);
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
      box-shadow: 0 3px 10px var(--shadow);
      font-size: 14px;
    }

    button:hover { transform: translateY(-1px); }
    button.primary {
      background: linear-gradient(180deg, #1f3d7a, #17325e);
      border-color: rgba(114, 214, 255, 0.35);
    }
    button.secondary {
      background: rgba(18, 32, 53, 0.9);
    }
  </style>
</head>
<body>
  <div class="dialog">
    <h1 id="dialogTitle" class="title">配置课表</h1>
    <p id="dialogMessage" class="subtitle">请选择操作</p>
    <div id="buttonList" class="button-list"></div>
    <div class="toolbar">
      <button id="cancelBtn" class="secondary" type="button">取消</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const params = new URLSearchParams(window.location.search);
    const payload = JSON.parse(decodeURIComponent(params.get('data') || '{}'));

    const titleEl = document.getElementById('dialogTitle');
    const messageEl = document.getElementById('dialogMessage');
    const listEl = document.getElementById('buttonList');
    const cancelBtn = document.getElementById('cancelBtn');

    titleEl.textContent = payload.title || '配置课表';
    messageEl.textContent = payload.message || '请选择操作';

    const buttons = Array.isArray(payload.buttons) ? payload.buttons : [];
    const defaultIndex = Number.isInteger(payload.defaultIndex) ? payload.defaultIndex : 0;

    buttons.forEach((label, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `option-btn ${index === defaultIndex ? 'primary' : ''}`;
      button.textContent = String(label);
      button.addEventListener('click', () => {
        ipcRenderer.send('schedule-dialog-result', index);
        window.close();
      });
      listEl.appendChild(button);
    });

    cancelBtn.addEventListener('click', () => {
      ipcRenderer.send('schedule-dialog-result', null);
      window.close();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        cancelBtn.click();
      }
    });
  </script>
</body>
</html>
