<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>软件设置</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111c2f;
      --border: #283a5d;
      --text: #eaf3ff;
      --muted: #a7b8d6;
      --accent: #72d6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding-top: 38px;
      color: var(--text);
      background: linear-gradient(180deg, #0b1220 0%, var(--bg) 100%);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    .window-titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      user-select: none;
    }
    .window-title { font-size: 13px; font-weight: 600; }
    .window-controls { height: 100%; display: flex; -webkit-app-region: no-drag; }
    .window-control {
      width: 46px;
      height: 100%;
      padding: 0;
      border: 0;
      color: var(--text);
      background: transparent;
      font-size: 16px;
    }
    .window-control:hover { background: rgba(114, 214, 255, 0.16); }
    .window-control.close:hover { background: #c54252; }
    .app { max-width: 1180px; margin: 0 auto; padding: 20px 18px 28px; }
    .toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 18px; }
    .settings-app { display: flex; min-height: calc(100vh - 86px); overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: rgba(17, 28, 47, 0.92); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25); }
    .nav-sidebar { width: 210px; flex-shrink: 0; padding: 18px 12px; border-right: 1px solid var(--border); background: rgba(16, 24, 38, 0.95); }
    .nav-brand { padding: 8px 10px 18px; font-size: 19px; font-weight: 700; }
    .nav-list { display: flex; flex-direction: column; gap: 8px; }
    .nav-item { width: 100%; text-align: left; color: var(--text); background: transparent; border-color: transparent; }
    .nav-item.active { color: var(--accent); background: rgba(114, 214, 255, 0.12); border-color: rgba(114, 214, 255, 0.35); }
    .main-content { flex: 1; min-width: 0; padding: 22px; overflow: auto; }
    .page { display: none; }
    .page.active { display: block; }
    button, select, input {
      font: inherit;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #162540;
    }
    button { cursor: pointer; padding: 9px 14px; }
    button:hover { border-color: var(--accent); }
    button.primary { color: #07111f; background: var(--accent); border-color: var(--accent); font-weight: 700; }
    .panel {
      padding: 26px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(17, 28, 47, 0.92);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .intro { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 14px; font-weight: 600; }
    select, input[type="date"] { width: 100%; min-height: 40px; padding: 8px 10px; }
    .checkbox-row { display: flex; align-items: center; gap: 10px; min-height: 40px; color: var(--muted); }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    input:disabled { cursor: not-allowed; opacity: 0.5; }
    .status { min-height: 20px; margin-top: 18px; color: #8ef2b1; font-size: 13px; }
    .style-editor { width: 100%; min-height: 480px; resize: vertical; padding: 14px; color: #dcecff; background: #0b1220; border: 1px solid var(--border); border-radius: 8px; font: 13px/1.55 Consolas, "Microsoft YaHei", monospace; tab-size: 4; white-space: pre; }
    .field-help { margin: -12px 0 14px; color: var(--muted); font-size: 13px; }
    .component-rows { display: flex; flex-direction: column; gap: 12px; }
    .component-row { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: rgba(11, 18, 32, 0.5); transition: border-color 0.12s ease, background 0.12s ease; }
    .component-row.drag-over { border-color: var(--accent); background: rgba(114, 214, 255, 0.1); }
    .component-row-title { color: var(--muted); font-size: 13px; cursor: grab; user-select: none; }
    .component-row-title:active { cursor: grabbing; }
    .component-options { display: flex; flex-wrap: wrap; gap: 12px; }
    .component-option { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
    .component-option input { width: 16px; height: 16px; }
    .component-order { display: flex; flex-wrap: wrap; gap: 8px; min-height: 34px; align-items: center; padding: 4px; border: 1px dashed transparent; border-radius: 8px; transition: border-color 0.12s ease, background 0.12s ease; }
    .component-order.drag-over { border-color: rgba(114, 214, 255, 0.65); background: rgba(114, 214, 255, 0.08); }
    .component-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 7px; background: #162540; cursor: grab; }
    .component-chip:active { cursor: grabbing; }
    .component-chip.dragging { opacity: 0.45; }
    .component-drag-handle { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 1px; user-select: none; }
    .component-chip .component-option { gap: 5px; }
    .component-chip button { padding: 2px 6px; font-size: 12px; }
    .component-add { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(40, 58, 93, 0.7); }
    .component-add select { width: auto; min-height: 32px; padding: 5px 8px; }
    .component-setting-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .component-setting-card { padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: rgba(11, 18, 32, 0.5); }
    .component-setting-card h3 { margin: 0 0 10px; font-size: 15px; }
    .component-setting-card p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .small-button { padding: 6px 9px; font-size: 12px; }
    @media (max-width: 640px) {
      .app { padding: 20px 14px 24px; }
      .panel { padding: 18px; }
      .settings-grid { grid-template-columns: 1fr; }
      .nav-sidebar { width: 145px; }
      .main-content { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="window-titlebar">
    <span class="window-title">软件设置</span>
    <div class="window-controls">
      <button class="window-control" data-window-action="minimize" title="最小化">−</button>
      <button class="window-control" data-window-action="toggle-maximize" title="还原/最大化">□</button>
      <button class="window-control close" data-window-action="close" title="关闭">×</button>
    </div>
  </div>
  <main class="app">
    <div class="toolbar">
      <button id="reloadBtn" type="button">刷新设置</button>
      <button id="saveBtn" class="primary" type="button">保存设置</button>
    </div>
    <div class="settings-app">
      <aside class="nav-sidebar">
        <div class="nav-brand">软件设置</div>
        <nav class="nav-list" id="settingsNav">
          <button class="nav-item active" data-page="basic" type="button">基础设置</button>
          <button class="nav-item" data-page="components" type="button">组件设置</button>
          <button class="nav-item" data-page="style" type="button">样式设置</button>
        </nav>
      </aside>
      <main class="main-content">
        <section class="page active" id="page-basic">
          <h1>基础设置</h1>
          <p class="intro">调整课表窗口的显示方式、倒计时和多周轮换。</p>
          <div class="panel">
            <div class="settings-grid">
        <div class="field">
          <label for="rotationOffset2">二周轮换</label>
          <select id="rotationOffset2" data-role="rotation-offset" data-weeks="2">
            <option value="0">第 1 周</option>
            <option value="1">第 2 周</option>
          </select>
        </div>
        <div class="field">
          <label for="rotationOffset3">三周轮换</label>
          <select id="rotationOffset3" data-role="rotation-offset" data-weeks="3">
            <option value="0">第 1 周</option>
            <option value="1">第 2 周</option>
            <option value="2">第 3 周</option>
          </select>
        </div>
        <div class="field">
          <label for="rotationOffset4">四周轮换</label>
          <select id="rotationOffset4" data-role="rotation-offset" data-weeks="4">
            <option value="0">第 1 周</option>
            <option value="1">第 2 周</option>
            <option value="2">第 3 周</option>
            <option value="3">第 4 周</option>
          </select>
        </div>
            </div>
          </div>
        </section>
        <section class="page" id="page-components">
          <h1>组件设置</h1>
          <p class="intro">管理组件的显示位置、顺序和专属选项。课表组件包含每节课的倒计时。</p>
          <div class="panel">
            <div class="toolbar" style="margin-bottom: 14px;">
              <strong>布局与组件</strong>
              <button id="addComponentRowBtn" class="small-button" type="button">新增一行</button>
            </div>
            <p class="field-help">拖动组件卡片调整顺序，或使用每个组件上的按钮移动、删除。课表组件必须保留。</p>
            <div id="componentRows" class="component-rows"></div>
          </div>
          <div class="panel" style="margin-top: 18px;">
            <strong>组件特定设置</strong>
            <p class="field-help" style="margin-top: 8px;">每个组件的显示选项只影响该组件，不会改变布局顺序。</p>
            <div id="componentSettings" class="component-setting-list"></div>
          </div>
        </section>
        <section class="page" id="page-style">
          <h1>样式设置</h1>
          <p class="intro">编辑 CSS 自定义属性和主界面样式。保存后主界面会自动刷新。</p>
          <div class="panel">
            <div class="field">
              <label for="cssStyleConfig">settings.js 的 css_style</label>
              <p class="field-help">使用 JSON 对象格式，例如 {"--center-font-size":"43px"}。</p>
              <textarea id="cssStyleConfig" class="style-editor" spellcheck="false"></textarea>
            </div>
            <div class="field" style="margin-top: 20px;">
              <label for="mainCss">主界面 css/style.css</label>
              <p class="field-help">这里的内容会直接写入主界面 CSS 文件，可修改颜色、字体、间距和其他规则。</p>
              <textarea id="mainCss" class="style-editor" spellcheck="false"></textarea>
            </div>
          </div>
        </section>
        <div id="status" class="status" aria-live="polite"></div>
      </main>
    </div>
  </main>
  <script>
    const { ipcRenderer } = require('electron');
    let config = null;
    let settings = null;
    let mainCss = '';
    let activePage = 'basic';
    const componentLabels = { schedule: '课表', week: '星期', countdown: '倒计日期', time: '时间', customText: '自定义文本' };

    document.querySelectorAll('[data-window-action]').forEach((button) => {
      button.addEventListener('click', () => ipcRenderer.send('window-control', button.dataset.windowAction));
    });

    function normalizeDateValue(value) {
      if (!value || value === 'hidden') return '';
      const match = String(value).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      return match ? `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}` : value;
    }

    function renderSettings() {
      const rotationOffset = settings?.rotation_offset || {};
      document.querySelectorAll('[data-role="rotation-offset"]').forEach((select) => {
        const weeks = Number(select.dataset.weeks);
        const value = Number(rotationOffset[weeks]);
        select.value = String(Number.isInteger(value) && value >= 0 && value < weeks ? value : 0);
      });
      renderComponentRows();
      renderComponentSettings();
      document.getElementById('cssStyleConfig').value = JSON.stringify(settings?.css_style || {}, null, 4);
      document.getElementById('mainCss').value = mainCss;
    }

    function loadSettings() {
      return Promise.all([
        ipcRenderer.invoke('read-config-file'),
        ipcRenderer.invoke('read-settings-file'),
        ipcRenderer.invoke('read-main-css-file')
      ]).then(([data, settingsData, css]) => {
        config = data;
        settings = settingsData;
        mainCss = css;
        renderSettings();
        document.getElementById('status').textContent = '';
      });
    }

    function collectRotationOffset() {
      const result = { 2: 0, 3: 0, 4: 0 };
      document.querySelectorAll('[data-role="rotation-offset"]').forEach((select) => {
        result[select.dataset.weeks] = Number(select.value);
      });
      return result;
    }

    function getComponentLayout() {
      const rows = [...document.querySelectorAll('.component-row')].map((row) =>
        [...row.querySelectorAll('.component-chip')].map((chip) => chip.dataset.componentKey)
      ).filter((row) => row.length);
      const hasSchedule = rows.some((row) => row.includes('schedule'));
      if (!hasSchedule) rows.unshift(['schedule']);
      return rows;
    }

    function getConfiguredComponentRows() {
      if (!Array.isArray(settings?.component_layout) || !settings.component_layout.length) {
        return [['schedule', 'week', 'countdown']];
      }
      return settings.component_layout.map((row) => (
        Array.isArray(row) ? row.filter((key) => componentLabels[key]) : []
      ));
    }

    function renderComponentSettings() {
      const container = document.getElementById('componentSettings');
      container.innerHTML = `
        <div class="component-setting-card">
          <h3>星期组件</h3>
          <p>显示当前星期和日期。</p>
          <label class="checkbox-row">
            <input id="weekDisplay" type="checkbox" ${config?.week_display === false ? '' : 'checked'} />
            <span>显示星期组件</span>
          </label>
        </div>
        <div class="component-setting-card">
          <h3>倒计日期组件</h3>
          <p>设置目标日期，或隐藏该组件。</p>
          <div class="field">
            <select id="countdownMode">
              <option value="date">按目标日期显示</option>
              <option value="hidden">隐藏倒计日期</option>
            </select>
            <input id="countdownTarget" type="date" />
          </div>
        </div>
        <div class="component-setting-card">
          <h3>课表组件</h3>
          <p>显示每日课程和课程倒计时，始终至少保留一个。</p>
        </div>
        <div class="component-setting-card">
          <h3>时间组件</h3>
          <p>选择显示偏移后的时间，还是系统当前时间。</p>
          <select id="timeSource">
            <option value="offset">偏移时间</option>
            <option value="system">系统时间</option>
          </select>
        </div>`;
      container.innerHTML += `
        <div class="component-setting-card">
          <h3>自定义文本组件</h3>
          <p>设置主界面显示的自定义文本。</p>
          <input id="customTextValue" type="text" value="${String(settings?.custom_text || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" />
        </div>`;
      const countdownMode = config?.countdown_target === 'hidden' ? 'hidden' : 'date';
      const modeInput = document.getElementById('countdownMode');
      const targetInput = document.getElementById('countdownTarget');
      modeInput.value = countdownMode;
      targetInput.disabled = countdownMode === 'hidden';
      targetInput.value = normalizeDateValue(config?.countdown_target || '');
      document.getElementById('timeSource').value = config?.time_source === 'system' ? 'system' : 'offset';
    }

    function renderComponentRows() {
      const container = document.getElementById('componentRows');
      if (!container) return;
      const rows = getConfiguredComponentRows();
      container.innerHTML = rows.map((components, rowIndex) => `
        <div class="component-row" data-row-index="${rowIndex}">
          <span class="component-row-title" draggable="true" title="拖动调整行顺序">第 ${rowIndex + 1} 行</span>
          <div>
            <div class="component-order">
              ${components.filter((key) => componentLabels[key]).map((key, componentIndex) => `
                <div class="component-chip" draggable="true" data-component-key="${key}" title="拖动调整组件顺序">
                  <span class="component-drag-handle" aria-hidden="true">拖动</span>
                  <span class="component-option">${componentLabels[key]}</span>
                  <button class="small-button" type="button" data-action="move-component-left" ${componentIndex === 0 ? 'disabled' : ''}>左移</button>
                  <button class="small-button" type="button" data-action="move-component-right" ${componentIndex === components.length - 1 ? 'disabled' : ''}>右移</button>
                  <button class="small-button" type="button" data-action="remove-component" ${key === 'schedule' ? 'disabled title="课表组件必须保留"' : 'title="从布局中删除"'}>删除</button>
                </div>
              `).join('')}
            </div>
            <div class="component-add">
              <select aria-label="选择要添加的组件">
                <option value="">添加组件...</option>
                ${Object.entries(componentLabels).filter(([key]) => !rows.some((row) => row.includes(key))).map(([key, label]) => `<option value="${key}">${label}</option>`).join('')}
              </select>
              <button class="small-button" type="button" data-action="add-component">添加</button>
            </div>
          </div>
          <div>
            <button class="small-button" type="button" data-action="move-component-row-up" ${rowIndex === 0 ? 'disabled' : ''}>上移</button>
            <button class="small-button" type="button" data-action="move-component-row-down" ${rowIndex === rows.length - 1 ? 'disabled' : ''}>下移</button>
            <button class="small-button" type="button" data-action="delete-component-row" ${rows.length === 1 ? 'disabled' : ''}>删除</button>
          </div>
        </div>
      `).join('');
    }

    function saveBasicSettings() {
      if (!settings) return;
      const nextSettings = JSON.parse(JSON.stringify(settings));
      nextSettings.rotation_offset = collectRotationOffset();
      ipcRenderer.invoke('save-settings-file', nextSettings).then(() => {
        settings = nextSettings;
        document.getElementById('status').textContent = '设置已保存';
      }).catch((error) => {
        console.error(error);
        document.getElementById('status').textContent = '保存失败，请检查配置格式';
      });
    }

    function saveComponentSettings() {
      if (!config) return;
      const nextConfig = JSON.parse(JSON.stringify(config));
      const nextSettings = JSON.parse(JSON.stringify(settings || {}));
      nextConfig.week_display = document.getElementById('weekDisplay').checked;
      nextSettings.component_layout = getComponentLayout();
      const countdownMode = document.getElementById('countdownMode').value;
      nextConfig.countdown_target = countdownMode === 'hidden'
        ? 'hidden'
        : document.getElementById('countdownTarget').value;
      nextConfig.time_source = document.getElementById('timeSource').value === 'system' ? 'system' : 'offset';
      nextSettings.custom_text = document.getElementById('customTextValue').value;
      Promise.all([
        ipcRenderer.invoke('save-config-file', nextConfig),
        ipcRenderer.invoke('save-settings-file', nextSettings)
      ]).then(() => {
        config = nextConfig;
        settings = nextSettings;
        renderComponentRows();
        document.getElementById('status').textContent = '组件设置已保存';
      }).catch((error) => {
        console.error(error);
        document.getElementById('status').textContent = '组件设置保存失败';
      });
    }

    function saveStyleSettings() {
      if (!config) return;
      let cssStyle;
      try {
        cssStyle = JSON.parse(document.getElementById('cssStyleConfig').value || '{}');
        if (!cssStyle || Array.isArray(cssStyle) || typeof cssStyle !== 'object') throw new Error('css_style 必须是对象');
      } catch (error) {
        document.getElementById('status').textContent = 'css_style 格式无效，请输入 JSON 对象';
        return;
      }
      const nextConfig = JSON.parse(JSON.stringify(config));
      const nextSettings = JSON.parse(JSON.stringify(settings || {}));
      nextSettings.css_style = cssStyle;
      mainCss = document.getElementById('mainCss').value;
      Promise.all([
        ipcRenderer.invoke('save-settings-file', nextSettings),
        ipcRenderer.invoke('save-main-css-file', mainCss)
      ]).then(() => {
        settings = nextSettings;
        document.getElementById('status').textContent = '样式已保存，主界面将在下次刷新后使用新样式';
      }).catch((error) => {
        console.error(error);
        document.getElementById('status').textContent = '样式保存失败';
      });
    }

    function saveSettings() {
      if (activePage === 'style') saveStyleSettings();
      else if (activePage === 'components') saveComponentSettings();
      else saveBasicSettings();
    }

    document.getElementById('settingsNav').addEventListener('click', (event) => {
      const target = event.target.closest('.nav-item');
      if (!target) return;
      activePage = target.dataset.page;
      document.querySelectorAll('.nav-item').forEach((button) => button.classList.toggle('active', button === target));
      document.querySelectorAll('.page').forEach((page) => page.classList.toggle('active', page.id === `page-${activePage}`));
      document.getElementById('saveBtn').textContent = activePage === 'style' ? '保存样式' : activePage === 'components' ? '保存组件设置' : '保存设置';
      document.getElementById('status').textContent = '';
    });

    document.getElementById('componentSettings').addEventListener('change', (event) => {
      if (event.target.id !== 'countdownMode') return;
      const targetInput = document.getElementById('countdownTarget');
      targetInput.disabled = event.target.value === 'hidden';
      if (targetInput.disabled) targetInput.value = '';
      else if (!targetInput.value) targetInput.value = '2025-01-01';
    });

    document.querySelectorAll('[data-role="rotation-offset"]').forEach((select) => {
      select.addEventListener('change', (event) => {
        const anchors = JSON.parse(localStorage.getItem('rotationWeekAnchors') || '{}');
        const now = new Date();
        const day = now.getDay();
        now.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
        now.setHours(0, 0, 0, 0);
        anchors[event.target.dataset.weeks] = now.getTime();
        localStorage.setItem('rotationWeekAnchors', JSON.stringify(anchors));
        saveSettings();
      });
    });

    document.getElementById('reloadBtn').addEventListener('click', loadSettings);
    document.getElementById('saveBtn').addEventListener('click', saveSettings);
    document.getElementById('addComponentRowBtn').addEventListener('click', () => {
      const rows = Array.isArray(settings?.component_layout) && settings.component_layout.length
        ? settings.component_layout.map((row) => Array.isArray(row) ? [...row] : [])
        : [['schedule', 'week', 'countdown']];
      rows.push([]);
      settings.component_layout = rows;
      renderComponentRows();
    });
    document.getElementById('componentRows').addEventListener('click', (event) => {
      const button = event.target.closest('[data-action="add-component"], [data-action="remove-component"]');
      if (!button) return;
      const row = button.closest('.component-row');
      if (!row) return;
      if (button.dataset.action === 'remove-component') {
        const chip = button.closest('.component-chip');
        if (chip?.dataset.componentKey !== 'schedule') chip?.remove();
      } else {
        const select = row.querySelector('.component-add select');
        if (!select?.value) return;
        const chip = document.createElement('div');
        chip.className = 'component-chip';
        chip.draggable = true;
        chip.dataset.componentKey = select.value;
        chip.title = '拖动调整组件顺序';
        chip.innerHTML = `<span class="component-drag-handle" aria-hidden="true">拖动</span><span class="component-option">${componentLabels[select.value]}</span><button class="small-button" type="button" data-action="move-component-left">左移</button><button class="small-button" type="button" data-action="move-component-right">右移</button><button class="small-button" type="button" data-action="remove-component" title="从布局中删除">删除</button>`;
        row.querySelector('.component-order').appendChild(chip);
      }
      renderComponentRowsFromDom();
    });
    let draggedComponent = null;
    let draggedRow = null;
    const componentRows = document.getElementById('componentRows');

    componentRows.addEventListener('dragstart', (event) => {
      const chip = event.target.closest('.component-chip');
      const rowTitle = event.target.closest('.component-row-title');
      if (chip) {
        draggedComponent = chip;
        draggedRow = null;
        chip.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
      } else if (rowTitle) {
        draggedRow = rowTitle.closest('.component-row');
        draggedComponent = null;
        event.dataTransfer.effectAllowed = 'move';
      }
    });

    componentRows.addEventListener('dragover', (event) => {
      if (draggedComponent) {
        const order = event.target.closest('.component-order');
        if (!order) return;
        event.preventDefault();
        order.classList.add('drag-over');
      } else if (draggedRow) {
        const row = event.target.closest('.component-row');
        if (!row || row === draggedRow) return;
        event.preventDefault();
        row.classList.add('drag-over');
      }
    });

    componentRows.addEventListener('dragleave', (event) => {
      const order = event.target.closest('.component-order');
      const row = event.target.closest('.component-row');
      if (order && !order.contains(event.relatedTarget)) order.classList.remove('drag-over');
      if (row && !row.contains(event.relatedTarget)) row.classList.remove('drag-over');
    });

    componentRows.addEventListener('drop', (event) => {
      event.preventDefault();
      const order = event.target.closest('.component-order');
      const targetRow = event.target.closest('.component-row');
      if (draggedComponent && order) {
        const targetChip = event.target.closest('.component-chip');
        if (targetChip && targetChip !== draggedComponent) {
          const insertBefore = event.clientX < targetChip.getBoundingClientRect().left + targetChip.offsetWidth / 2;
          order.insertBefore(draggedComponent, insertBefore ? targetChip : targetChip.nextElementSibling);
        } else if (!targetChip) {
          order.appendChild(draggedComponent);
        }
        renderComponentRowsFromDom();
      } else if (draggedRow && targetRow && targetRow !== draggedRow) {
        const insertBefore = event.clientY < targetRow.getBoundingClientRect().top + targetRow.offsetHeight / 2;
        componentRows.insertBefore(draggedRow, insertBefore ? targetRow : targetRow.nextElementSibling);
        updateComponentRowTitles();
      }
      clearDragState();
    });

    componentRows.addEventListener('dragend', clearDragState);

    function clearDragState() {
      if (draggedComponent) draggedComponent.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach((element) => element.classList.remove('drag-over'));
      draggedComponent = null;
      draggedRow = null;
    }

    function updateComponentRowTitles() {
      document.querySelectorAll('.component-row').forEach((item, index) => {
        item.dataset.rowIndex = index;
        item.querySelector('.component-row-title').textContent = `第 ${index + 1} 行`;
      });
    }

    document.addEventListener('click', (event) => {
      const button = event.target.closest('[data-action="delete-component-row"], [data-action="move-component-row-up"], [data-action="move-component-row-down"], [data-action="move-component-left"], [data-action="move-component-right"]');
      if (!button) return;
      const row = button.closest('.component-row');
      if (button.dataset.action === 'move-component-left' || button.dataset.action === 'move-component-right') {
        const chip = button.closest('.component-chip');
        const sibling = button.dataset.action === 'move-component-left' ? chip?.previousElementSibling : chip?.nextElementSibling;
        if (chip && sibling) {
          if (button.dataset.action === 'move-component-left') chip.parentElement.insertBefore(chip, sibling);
          else chip.parentElement.insertBefore(sibling, chip);
          renderComponentRowsFromDom();
        }
        return;
      }
      if (button.dataset.action === 'delete-component-row') row?.remove();
      if (button.dataset.action === 'move-component-row-up' && row?.previousElementSibling) {
        row.parentElement.insertBefore(row, row.previousElementSibling);
      }
      if (button.dataset.action === 'move-component-row-down' && row?.nextElementSibling) {
        row.parentElement.insertBefore(row.nextElementSibling, row);
      }
      updateComponentRowTitles();
    });

    function renderComponentRowsFromDom() {
      settings.component_layout = getComponentLayout();
      renderComponentRows();
    }
    loadSettings().catch((error) => {
      console.error(error);
      renderComponentRows();
      renderComponentSettings();
      document.getElementById('status').textContent = '读取配置文件失败';
    });
  </script>
</body>
</html>
